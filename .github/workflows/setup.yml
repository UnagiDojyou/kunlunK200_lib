name: source-checks

on: [push, pull_request]

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell and Python syntax
        shell: bash
        run: |
          find setup clock bench docker cmake tools -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          python3 -m py_compile tools/thermal-guard.py
      - name: Public headers do not require SDK headers
        run: g++ -std=c++14 -fsyntax-only -Iinclude examples/library/memory.cpp
      - name: Hardware test instructions
        run: echo 'Build with external XRE/XDNN/XTDK, then run tools/verify.sh on K200 with the thermal guard.'
